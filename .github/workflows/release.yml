name: Release npm packages

on:
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          package-manager-cache: false
      - name: Verify npm trusted-publishing floor
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major,minor,patch]=process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) process.exit(1)' "$npm_version"
      - run: pnpm install --frozen-lockfile
      - name: Version the fixed package pair
        run: pnpm changeset version
      - name: Sync the release lockfile
        run: pnpm install --lockfile-only
      - name: Commit the release version
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: version npm packages"
          git push origin HEAD:main
      - run: pnpm run release
      - name: Push release tags
        run: git push origin --follow-tags
